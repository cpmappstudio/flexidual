allowBuilds:
  '@clerk/shared': true
  '@posthog/cli': true
  '@tailwindcss/oxide': true
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  # Recovery fix for https://github.com/get-convex/presence/issues/54.
  # Remove when upgrading to an upstream release with equivalent recovery tests.
  '@convex-dev/presence@0.4.0': patches/@convex-dev__presence@0.4.0.patch
  # Dev-only scheduler backport from convex-test v0.0.60; keeps recovery tests deterministic.
  convex-test@0.0.54: patches/convex-test@0.0.54.patch
  # Official LiveKit #2167/#2168 backport: cancel discarded incoming streams.
  # Remove when an upstream release passes whiteboard-stream-sdk tests.
  livekit-client@2.22.4: patches/livekit-client@2.22.4.patch
